# Weekly encrypted backup of this repo to Drive; same file name each week, so only the newest stays.
# Restore: download repo.zip.enc, then
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -pass pass:<SCRIPT_KEY> -in repo.zip.enc -out repo.zip
#   unzip repo.zip -d restored   # push "restored" to a new repo and re-add the secrets
name: backup
run-name: b ${{ github.run_number }}
on:
  schedule: [{cron: "23 4 * * 0"}]
  workflow_dispatch:
permissions: {contents: read}

jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - env:
          SCRIPT_KEY: ${{ secrets.SCRIPT_KEY }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          zip -qr repo.zip . -x '.git/*' 'node_modules/*'
          openssl enc -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -salt -pass env:SCRIPT_KEY -in repo.zip -out repo.zip.enc
          printf '%s' "$RCLONE_CONF" > rc.conf
          rclone --config rc.conf copyto repo.zip.enc gdrive:Backups/repo.zip.enc
