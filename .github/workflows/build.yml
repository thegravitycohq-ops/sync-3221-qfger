name: build
run-name: r ${{ github.run_number }}
on: workflow_dispatch
concurrency: {group: b, cancel-in-progress: false}
permissions: {contents: read}

jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs: {m: "${{ steps.o.outputs.m }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: m1}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
      - name: prep
        id: o
        env: {SCRIPT_KEY: "${{ secrets.SCRIPT_KEY }}"}
        run: |
          mkdir w
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -pass env:SCRIPT_KEY -in src/r/in.bin -out w/script.json
          python src/b/prep.py w
          rm w/script.json
          jq -r .slug w/plan.json > w/slug.txt
          enc() { openssl enc -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -salt -pass env:SCRIPT_KEY -out "$1"; }
          tar -C w -cf - plan.json | enc p1.bin
          tar -C w -cf - narration.m4a captions.srt desc.txt slug.txt | enc p2.bin
      - uses: actions/upload-artifact@v4
        with: {name: p1, path: p1.bin, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: p2, path: p2.bin, retention-days: 1}

  d:
    needs: p
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      max-parallel: 20
      matrix: {c: "${{ fromJson(needs.p.outputs.m) }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-roboto libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2t64
          pip install -q numpy pillow
          npm ci --no-audit --no-fund
          python src/b/paper.py
      - uses: actions/download-artifact@v4
        with: {name: p1}
      - name: draw
        env: {SCRIPT_KEY: "${{ secrets.SCRIPT_KEY }}"}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -pass env:SCRIPT_KEY -in p1.bin | tar -x
          npx remotion render src/r/index.ts V c.mp4 --props=plan.json --frames=${{ matrix.c.a }}-${{ matrix.c.b }} --concurrency=4 --crf=26 --log=error
          rm plan.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -salt -pass env:SCRIPT_KEY -in c.mp4 -out c.bin
      - uses: actions/upload-artifact@v4
        with:
          name: c-${{ matrix.c.i }}
          path: c.bin
          retention-days: 1

  m:
    needs: d
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read, actions: write}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone ffmpeg
      - uses: actions/download-artifact@v4
        with: {pattern: "*", path: dl}
      - name: merge and upload
        env:
          SCRIPT_KEY: ${{ secrets.SCRIPT_KEY }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dec() { openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -pass env:SCRIPT_KEY -in "$1"; }
          mkdir o && dec dl/p2/p2.bin | tar -x -C o
          : > list.txt
          for d in $(ls -d dl/c-* | sort -V); do
            n=$(basename $d); dec $d/c.bin > $n.mp4; echo "file '$PWD/$n.mp4'" >> list.txt
          done
          ffmpeg -v error -f concat -safe 0 -i list.txt -i o/narration.m4a -c:v copy -c:a copy -movflags +faststart o/video.mp4
          printf '%s' "$RCLONE_CONF" > rc.conf
          S=$(cat o/slug.txt)
          rclone --config rc.conf copyto o/video.mp4 "gdrive:Out/$S/video.mp4"
          rclone --config rc.conf copyto o/captions.srt "gdrive:Out/$S/captions.srt"
          rclone --config rc.conf copyto o/desc.txt "gdrive:Out/$S/desc.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
